# Copia questo file in config/leagues.yaml e personalizzalo.
#
# Ogni lega e' configurabile indipendentemente: competizione, squadra da
# seguire, destinatari WhatsApp, intervallo di polling e offset dei
# promemoria formazione. Aggiungere una nuova lega significa aggiungere
# una nuova voce a questo elenco.

leagues:
  - id: mantra-cormolittoriano
    name: "Mantra Cormolittoriano"
    url: "https://leghe.fantacalcio.it/mantra-cormolittoriano/"
    season: "2025-26"
    # Nome ESATTO della tua squadra cosi' come appare in classifica.
    team_name: "Nome Squadra"
    # ID della competizione, visibile nell'URL quando apri la Classifica
    # sul sito: https://leghe.fantacalcio.it/<slug>/view/competition/<ID>/standings
    competition_id: 706778
    # "A" per la divisione principale (Serie A classica/Mantra); cambia
    # solo se la tua lega ha piu' divisioni.
    division: "A"
    # Nome della variabile d'ambiente (definita in .env) che contiene il
    # valore dell'header app_key. Vedi README > Autenticazione.
    api_key_env: FANTACALCIO_API_KEY_MANTRA_CORMOLITTORIANO
    recipients:
      - "393331234567"
      - "393401234567"
    poll_interval_seconds: 300
    reminder_offsets_hours: [24, 1]

  # Esempio di seconda lega con configurazione indipendente:
  # - id: altra-lega
  #   name: "Altra Lega"
